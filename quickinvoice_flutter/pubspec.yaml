name: inovxa
description: InovXA - A simple, fast invoice generator that exports professional PDFs.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # PDF generation
  pdf: ^3.11.1
  printing: ^5.13.2

  # Image picking for the logo
  image_picker: ^1.1.2

  # Filesystem paths (saving the PDF locally)
  path_provider: ^2.1.4

  # Sharing the generated PDF (WhatsApp, email, etc.)
  share_plus: ^10.0.2

  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
